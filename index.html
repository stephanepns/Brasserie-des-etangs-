<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#1a1612">
  <title>Brasserie - Stock</title>
  <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%231a1612'/%3E%3Ctext x='50' y='65' font-size='50' text-anchor='middle' fill='%23c9a961'%3E%F0%9F%8D%BA%3C/text%3E%3C/svg%3E">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #1a1612;
      --card: #23201c;
      --card-hover: #2a2621;
      --border: #3a352f;
      --or: #c9a961;
      --vert: #7ba828;
      --cuivre: #b87333;
      --rouge: #e57373;
      --texte: #e8e2d5;
      --muted: #8a8478;
      --vert-optimal: #7ba828;
      --orange: #e8a04e;
      --gris: #6a655d;
      --whatsapp: #25D366;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--texte);
      min-height: 100vh;
      padding-bottom: 100px;
      -webkit-font-smoothing: antialiased;
    }
    header {
      padding: 32px 20px 16px;
      border-bottom: 1px solid var(--border);
      text-align: center;
    }
    h1 {
      font-size: 26px;
      font-weight: 800;
      color: var(--or);
      margin-bottom: 4px;
      letter-spacing: -0.5px;
    }
    .description {
      font-size: 14px;
      color: var(--muted);
      font-style: italic;
    }
    .meta {
      font-size: 11px;
      color: var(--muted);
      margin-top: 12px;
    }
    
    .filtres {
      display: flex;
      gap: 8px;
      padding: 16px 20px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }
    .filtres::-webkit-scrollbar { display: none; }
    .chip {
      flex-shrink: 0;
      padding: 8px 16px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      font-size: 13px;
      color: var(--texte);
      cursor: pointer;
      transition: all 0.2s;
      font-weight: 500;
    }
    .chip.actif {
      background: var(--or);
      color: var(--bg);
      border-color: var(--or);
      font-weight: 700;
    }

    .liste { padding: 0 16px; }
    .biere {
      background: var(--card);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 12px;
      border: 1px solid var(--border);
      transition: transform 0.15s, box-shadow 0.15s;
    }
    .biere:active { transform: scale(0.98); }
    
    .biere-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 8px;
      gap: 10px;
    }
    .biere-nom {
      font-size: 16px;
      font-weight: 700;
      line-height: 1.3;
    }
    .badge {
      flex-shrink: 0;
      padding: 4px 10px;
      border-radius: 8px;
      font-size: 10px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .badge-optimal { background: rgba(123,168,40,0.2); color: var(--vert-optimal); }
    .badge-jeune { background: rgba(232,160,78,0.2); color: var(--orange); }
    .badge-vite { background: rgba(232,160,78,0.25); color: var(--orange); }
    .badge-passe { background: rgba(106,101,93,0.2); color: var(--gris); }

    .biere-style {
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 12px;
    }
    .biere-infos {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      background: var(--bg);
      padding: 10px 12px;
      border-radius: 10px;
      margin-bottom: 12px;
    }
    .dispo { font-size: 13px; color: var(--texte); }
    .prix { font-size: 16px; font-weight: 800; color: var(--vert-optimal); }

    .btn-commander {
      width: 100%;
      padding: 12px;
      background: transparent;
      border: 1.5px solid var(--or);
      color: var(--or);
      border-radius: 12px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.15s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .btn-commander:active, .btn-commander.ajoute {
      background: var(--or);
      color: var(--bg);
    }

    .panier-sticky {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      background: var(--card);
      border-top: 1px solid var(--border);
      padding: 16px 20px;
      padding-bottom: calc(16px + env(safe-area-inset-bottom));
      display: none;
      align-items: center;
      justify-content: space-between;
      z-index: 100;
      box-shadow: 0 -4px 20px rgba(0,0,0,0.5);
    }
    .panier-sticky.visible { display: flex; }
    
    .panier-info { display: flex; flex-direction: column; gap: 2px; }
    .panier-total { font-size: 18px; font-weight: 800; color: var(--or); }
    .panier-details { font-size: 12px; color: var(--muted); }

    .btn-whatsapp {
      background: var(--whatsapp);
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 30px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 4px 12px rgba(37, 211, 102, 0.3);
    }
    .btn-whatsapp:active { transform: scale(0.95); }

    .modal-overlay {
      display: none;
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.8);
      z-index: 200;
      align-items: flex-end;
      justify-content: center;
      backdrop-filter: blur(4px);
    }
    .modal-overlay.visible { display: flex; }
    .modal {
      background: var(--card);
      width: 100%;
      max-height: 85vh;
      border-radius: 24px 24px 0 0;
      padding: 24px 20px;
      overflow-y: auto;
      animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }
    @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
    
    .modal-header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 20px;
    }
    .modal h2 { font-size: 20px; color: var(--or); }

    .panier-ligne {
      display: flex; justify-content: space-between; align-items: center;
      padding: 12px 0; border-bottom: 1px solid var(--border);
    }
    .panier-ligne:last-child { border-bottom: none; }
    .panier-nom { font-size: 14px; font-weight: 600; }
    .panier-qte { display: flex; align-items: center; gap: 12px; background: var(--bg); padding: 4px; border-radius: 20px;}
    .btn-qte {
      width: 32px; height: 32px; border-radius: 16px; background: var(--border);
      border: none; color: var(--texte); font-size: 18px; font-weight: bold;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
    }
    .btn-qte:active { background: var(--or); color: var(--bg); }
    .qte-val { min-width: 24px; text-align: center; font-weight: 700; font-size: 15px;}
    
    .btn-fermer { width: 100%; padding: 16px; background: transparent; color: var(--muted); border: none; font-size: 14px; font-weight: bold; cursor: pointer; }

    .vide { text-align: center; padding: 40px 20px; color: var(--muted); }
    .erreur { background: rgba(229,115,115,0.1); border: 1px solid var(--rouge); color: var(--rouge); padding: 16px; border-radius: 12px; margin: 20px; font-size: 13px; text-align: center; }
  </style>
</head>
<body>
  <header>
    <h1 id="nomBrasserie">Chargement...</h1>
    <div class="description" id="description"></div>
    <div class="meta" id="meta"></div>
  </header>

  <div class="filtres" id="filtres"></div>
  <div class="liste" id="liste"></div>

  <div class="panier-sticky" id="panierSticky" onclick="ouvrirPanier()">
    <div class="panier-info">
      <span class="panier-total" id="panierTotalSticky">0.00 €</span>
      <span class="panier-details" id="panierDetailsSticky">0 article</span>
    </div>
    <button class="btn-whatsapp">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413Z"/></svg>
      Commander
    </button>
  </div>

  <div class="modal-overlay" id="modal" onclick="fermerPanier(event)">
    <div class="modal" onclick="event.stopPropagation()">
      <div class="modal-header">
        <h2>Ma commande</h2>
        <button class="btn-qte" onclick="fermerPanier()">✕</button>
      </div>
      <div id="panierContenu"></div>
      <div style="margin-top:20px;">
        <button class="btn-whatsapp" style="width:100%; justify-content:center;" onclick="envoyerWhatsApp()">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413Z"/></svg>
          Envoyer la commande
        </button>
        <button class="btn-fermer" onclick="fermerPanier()">Continuer mes achats</button>
      </div>
    </div>
  </div>

  <script>
    let data = null;
    let filtreActif = 'Tous';
    let panier = JSON.parse(localStorage.getItem('panier_brasserie') || '{}');

    async function charger() {
      try {
        const resp = await fetch('stock.json?t=' + Date.now());
        if (!resp.ok) throw new Error('Fichier stock.json introuvable');
        data = await resp.json();
        afficher();
      } catch (e) {
        document.getElementById('liste').innerHTML =
          '<div class="erreur">⚠️ Le stock n\'est pas encore disponible.<br>Revenez plus tard !<br><br><small>' + e.message + '</small></div>';
        document.getElementById('nomBrasserie').textContent = 'Brasserie';
      }
    }

    function afficher() {
      document.getElementById('nomBrasserie').textContent = data.nomBrasserie || 'Brasserie Artisanale';
      document.getElementById('description').textContent = data.description || '';
      
      const date = new Date(data.dateExport);
      document.getElementById('meta').textContent = 'Mise à jour : ' + date.toLocaleDateString('fr-FR', { day: '2-digit', month: 'long', hour: '2-digit', minute: '2-digit' });

      const styles = ['Tous', ...new Set(data.bieres.map(b => b.style))];
      document.getElementById('filtres').innerHTML = styles.map(s =>
        `<button class="chip ${s === filtreActif ? 'actif' : ''}" onclick="filtrer('${s.replace(/'/g, "\\'")}')">${s}</button>`
      ).join('');

      const bieresFiltrees = filtreActif === 'Tous' ? data.bieres : data.bieres.filter(b => b.style === filtreActif);
      const listeEl = document.getElementById('liste');
      
      if (bieresFiltrees.length === 0) {
        listeEl.innerHTML = '<div class="vide"><div style="font-size:40px;margin-bottom:10px;">🍺</div>Aucune bière dans cette catégorie.</div>';
      } else {
        listeEl.innerHTML = bieresFiltrees.map(b => carteBiere(b)).join('');
      }
      majPanier();
    }

    function carteBiere(b) {
      const cle = b.nom + '|' + b.format;
      const qte = panier[cle] || 0;
      const badgeClass = { 'optimal': 'badge-optimal', 'tropJeune': 'badge-jeune', 'bientotTropVieux': 'badge-vite', 'tropVieux': 'badge-passe' }[b.apogee] || 'badge-jeune';
      const prixAffiche = b.prix > 0 ? b.prix.toFixed(2) + ' €' : 'Offert';
      const boutonTexte = qte > 0 ? `✓ Ajouté (${qte})` : '+ Ajouter';
      const boutonClass = qte > 0 ? 'ajoute' : '';

      return `
        <div class="biere">
          <div class="biere-header">
            <div class="biere-nom">${echapper(b.nom)}</div>
            <span class="badge ${badgeClass}">${b.apogeeLabel}</span>
          </div>
          <div class="biere-style">${echapper(b.style)} · ${b.format}</div>
          
          <div class="biere-infos">
            <span class="dispo">${b.nombreBouteilles} bouteille${b.nombreBouteilles > 1 ? 's' : ''}</span>
            <span class="prix">${prixAffiche}</span>
          </div>
          
          <button class="btn-commander ${boutonClass}" onclick="ajouterAuPanier('${cle.replace(/'/g, "\\'")}')">
            ${boutonTexte}
          </button>
        </div>
      `;
    }

    function echapper(s) { return String(s).replace(/[<>&"]/g, c => ({ '<': '&lt;', '>': '&gt;', '&': '&amp;', '"': '&quot;' }[c])); }
    function filtrer(style) { filtreActif = style; afficher(); }

    function ajouterAuPanier(cle) {
      panier[cle] = (panier[cle] || 0) + 1;
      sauverPanier();
      afficher();
    }
    function retirerDuPanier(cle) {
      if (!panier[cle]) return;
      panier[cle]--;
      if (panier[cle] <= 0) delete panier[cle];
      sauverPanier();
      afficher();
      majPanierModal();
    }
    function sauverPanier() { localStorage.setItem('panier_brasserie', JSON.stringify(panier)); }

    function trouverBiere(cle) { return data.bieres.find(b => (b.nom + '|' + b.format) === cle); }

    function majPanier() {
      const entries = Object.entries(panier);
      const totalItems = entries.reduce((a, [_, q]) => a + q, 0);
      const sticky = document.getElementById('panierSticky');
      
      if (totalItems === 0) {
        sticky.classList.remove('visible');
        return;
      }
      
      sticky.classList.add('visible');
      
      let total = 0;
      entries.forEach(([cle, qte]) => {
        const b = trouverBiere(cle);
        if (b) total += b.prix * qte;
      });

      document.getElementById('panierTotalSticky').textContent = total.toFixed(2) + ' €';
      document.getElementById('panierDetailsSticky').textContent = `${totalItems} article${totalItems > 1 ? 's' : ''}`;
    }

    function ouvrirPanier() {
      majPanierModal();
      document.getElementById('modal').classList.add('visible');
    }
    function fermerPanier(e) {
      if (e && e.target.id !== 'modal') return;
      document.getElementById('modal').classList.remove('visible');
    }

    function majPanierModal() {
      const contenu = document.getElementById('panierContenu');
      const entries = Object.entries(panier);

      if (entries.length === 0) {
        contenu.innerHTML = '<div class="vide">Votre panier est vide.</div>';
        return;
      }

      contenu.innerHTML = entries.map(([cle, qte]) => {
        const b = trouverBiere(cle);
        if (!b) return '';
        return `
          <div class="panier-ligne">
            <div class="panier-nom">${echapper(b.nom)}<br><small style="color:var(--muted)">${b.format}</small></div>
            <div class="panier-qte">
              <button class="btn-qte" onclick="retirerDuPanier('${cle.replace(/'/g, "\\'")}')">−</button>
              <span class="qte-val">${qte}</span>
              <button class="btn-qte" onclick="ajouterAuPanier('${cle.replace(/'/g, "\\'")}'); majPanierModal();">+</button>
            </div>
          </div>
        `;
      }).join('');
    }

    function envoyerWhatsApp() {
      const entries = Object.entries(panier);
      if (entries.length === 0) return alert('Votre panier est vide !');

      let total = 0;
      let message = 'Bonjour ! Je souhaite commander :\n\n';
      
      entries.forEach(([cle, qte]) => {
        const b = trouverBiere(cle);
        if (!b) return;
        total += b.prix * qte;
        message += `🍺 *${qte}x ${b.nom}* (${b.format})\n`;
        if (b.prix > 0) message += ` _${(b.prix * qte).toFixed(2)} €_\n`;
      });

      if (total > 0) message += `\n💰 *Total : ${total.toFixed(2)} €*`;
      message += '\n\nMerci ! 🙏';

      const tel = (data.telephone || '').replace(/[^\d]/g, '');
      if (!tel) return alert("Le numéro de téléphone de la brasserie n'est pas configuré.");

      window.open('https://wa.me/' + tel + '?text=' + encodeURIComponent(message), '_blank');
    }

    charger();
  </script>
</body>
</html>
